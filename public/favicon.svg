<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="voGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#voGrad)" />

  <!-- Outer Soundwaves -->
  <path d="M12 24 C10 27 10 37 12 40" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M52 24 C54 27 54 37 52 40" stroke="#D8B4FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <path d="M17 20 C14 24 14 40 17 44" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M47 20 C50 24 50 40 47 44" stroke="#E9D5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Studio Microphone Capsule -->
  <!-- Mic Body -->
  <rect x="25" y="14" width="14" height="23" rx="7" fill="#FFFFFF" filter="url(#glow)" />
  <!-- Mic Grid lines -->
  <line x1="28" y1="21" x2="36" y2="21" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round" opacity="0.3" />
  <line x1="28" y1="26" x2="36" y2="26" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round" opacity="0.3" />

  <!-- Mic U-Bracket Stand -->
  <path d="M21 28 C21 37 43 37 43 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <line x1="32" y1="37" x2="32" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="24" y1="46" x2="40" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sparkle / AI Star -->
  <path d="M48 10 L49.5 13.5 L53 15 L49.5 16.5 L48 20 L46.5 16.5 L43 15 L46.5 13.5 Z" fill="#38BDF8" />
  <circle cx="48" cy="15" r="1" fill="#FFFFFF" />

  <!-- Pulse Status Dot -->
  <circle cx="16" cy="13" r="3" fill="#10B981" />
  <circle cx="16" cy="13" r="1.5" fill="#FFFFFF" />
</svg>
